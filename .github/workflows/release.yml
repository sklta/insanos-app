# Publica uma versão do app: roda os testes, gera o InsanosApp.exe a partir DESTE código, calcula a impressão
# digital (SHA-256), registra uma atestação assinada pelo GitHub de que o .exe saiu deste repositório e deste
# workflow, assina o .exe para a atualização automática do app (segredo UPDATE_SIGNING_KEY), manda o .exe para o
# VirusTotal (se a chave estiver configurada) e cria o release com tudo isso.
# Dispara com uma tag v* (por exemplo v0.1.0). Tag com hífen (v0.1.0-beta.1) sai como pré-lançamento.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # criar o release
  id-token: write       # assinar a atestação
  attestations: write   # guardar a atestação

jobs:
  release:
    runs-on: windows-latest
    # a chave de assinatura (UPDATE_SIGNING_KEY) mora no ambiente "lancamento", liberado só para tags v*; e só o dono
    # do repositório cria tags v* (regra do repositório). Branch ou workflow de outra pessoa não chega na chave.
    environment: lancamento
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # o token do GitHub não fica guardado no git da máquina

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Testes do núcleo
        run: dotnet run --project InsanosApp.Tests -c Release

      - name: Gerar o .exe
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $num = ($v -split '-')[0]
          dotnet publish InsanosApp/InsanosApp.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$num -p:InformationalVersion=$v -o out
          $exe = "InsanosApp-$v.exe"
          Copy-Item out/InsanosApp.exe $exe
          $h = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$h  $exe" | Out-File -Encoding ascii "$exe.sha256"
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "SHA256=$h" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # O app só aceita uma atualização com esta assinatura (Core/Updater.cs): ECDSA P-256 sobre
      # "insanos-app", a versão e o SHA-256 do .exe, um por linha. A chave pública está no código do app.
      - name: Assinar para a atualização automática
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) { throw "Falta o segredo UPDATE_SIGNING_KEY: sem ele os apps não aceitam a atualização." }
          $ec = [System.Security.Cryptography.ECDsa]::Create()
          $ec.ImportFromPem($env:UPDATE_SIGNING_KEY)
          $pv = [Version]$env:VERSION
          $ver = "{0}.{1}.{2}" -f $pv.Major, $pv.Minor, [Math]::Max(0, $pv.Build)   # sempre 3 partes, como o app
          $msg = [System.Text.Encoding]::UTF8.GetBytes("insanos-app`n$ver`n$env:SHA256")
          $sig = $ec.SignData($msg, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
          [System.IO.File]::WriteAllText("$env:EXE.sig", [Convert]::ToBase64String($sig))
          # confere com a chave pública que vai no app, antes de publicar
          $pub = (Select-String -Path InsanosApp/Core/Updater.cs -Pattern '"(MFkw[A-Za-z0-9+/=]+)"').Matches[0].Groups[1].Value
          $check = [System.Security.Cryptography.ECDsa]::Create()
          $read = 0
          $check.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($pub), [ref]$read)
          if (-not $check.VerifyData($msg, $sig, [System.Security.Cryptography.HashAlgorithmName]::SHA256)) {
            throw "A assinatura não bate com a chave pública do app (Core/Updater.cs)."
          }
          "SIGNED=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Atestação de origem (assinada pelo GitHub)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ env.EXE }}

      - name: VirusTotal
        if: env.VT_API_KEY != ''
        shell: pwsh
        run: |
          $r = curl.exe -s --request POST --url https://www.virustotal.com/api/v3/files `
            --header "x-apikey: $env:VT_API_KEY" --form "file=@$env:EXE"
          if ($LASTEXITCODE -ne 0) { Write-Warning "VirusTotal não respondeu"; exit 0 }
          "VT_URL=https://www.virustotal.com/gui/file/$env:SHA256" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Criar o release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vt = if ($env:VT_URL) { "- **VirusTotal:** $env:VT_URL" } else { "- **VirusTotal:** envie o .exe em https://www.virustotal.com para conferir" }
          $notes = @"
          ## App Insanos $env:VERSION

          Baixe o **$env:EXE** abaixo e abra. Não precisa instalar nada.

          ### Como conferir que este .exe é deste código

          - **SHA-256:** ``$env:SHA256``
            No PowerShell: ``Get-FileHash .\$env:EXE -Algorithm SHA256``
          - **Atestação do GitHub:** este .exe foi gerado pelo workflow ``release.yml`` a partir do commit ``${{ github.sha }}``.
            Para conferir: ``gh attestation verify .\$env:EXE -R ${{ github.repository }}``
          $vt
          - **Atualização automática:** o ``.sig`` é a assinatura que o próprio app confere antes de se atualizar sozinho.

          Leia a seção **Segurança** do README para saber o que o app faz e o que não faz.
          "@ -replace '(?m)^          ', ''
          $files = @($env:EXE, "$env:EXE.sha256")
          if ($env:SIGNED) { $files += "$env:EXE.sig" }
          $a = @("${{ github.ref_name }}") + $files + @('--title', "App Insanos $env:VERSION", '--notes', $notes)
          if ($env:VERSION -match '-') { $a += '--prerelease' }
          gh release create @a
